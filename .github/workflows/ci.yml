name: CI

# fmt, strict clippy and the workspace tests on GitHub-hosted runners: Linux
# (arm64, standing in for the lab Pis, and x86-64), macOS and Windows. EAB is
# public, so the minutes are free, and no pull request from a fork runs on lab
# hardware. Until 2026-10-06 this ran on self-hosted runners on dolores and the
# Mac mini, in persistent clones under ci/eab.
#
# EAB depends on loadngo and qcoin by sibling path (../loadngo, ../qcoin), so
# both are checked out beside it, pinned. Cargo.lock records their
# dependencies, so `--locked` fails when a pin and the lock disagree: when
# Cargo.lock is refreshed for a newer loadngo or qcoin, move LOADNGO_REV /
# QCOIN_REV to those commits in the same EAB commit. qcoin itself pins a
# loadngo revision (its LOADNGO_REV); keep EAB's loadngo pin the same one.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LOADNGO_REV: e32677614852432348d976b17c16b84a6957828e
  QCOIN_REV: 93a1adabccaf90bc8e2a57819cc97bef21cde79c

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide what the others report.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Allow long paths in git
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          path: entitlement-achievement-blockchain

      - uses: actions/checkout@v4
        with:
          repository: jaylauffer/loadngo
          ref: ${{ env.LOADNGO_REV }}
          path: loadngo

      - uses: actions/checkout@v4
        with:
          repository: jaylauffer/qcoin
          ref: ${{ env.QCOIN_REV }}
          path: qcoin

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: entitlement-achievement-blockchain

      - name: cargo fmt --check
        working-directory: entitlement-achievement-blockchain
        run: cargo fmt --check

      - name: cargo clippy (warnings are errors)
        working-directory: entitlement-achievement-blockchain
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: entitlement-achievement-blockchain
        # --no-fail-fast: report every failing crate in one run.
        run: cargo test --locked --no-fail-fast --workspace
