name: CI

# Runs on any self-hosted runner advertising `build-linux-arm64` (aarch64
# Linux). Not actions/checkout: Cargo.toml has path dependencies on sibling
# repos (../qcoin, ../loadngo) that live next to this repo under ~/pudding/
# on the runner. actions/checkout only ever checks out this one repo into
# an isolated ephemeral workspace, so those siblings would never be
# present there. Instead, sync the persistent clone that's already
# correctly positioned next to them to the exact commit that triggered
# this run. This also keeps target/ warm between runs for faster
# incremental builds.
#
# fmt is currently clean; clippy is not (real pre-existing debt, this repo
# has no [workspace.lints] policy yet) — expect clippy to start red until
# that's addressed separately. Not something this workflow silently works
# around.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Matched by *capability*, never by machine name: GitHub matches
    # runs-on against labels only, and a runner's own name is never
    # implicitly one — a mismatch this workflow hit once already. Any
    # runner advertising this label can serve the job. Safe to share the
    # label across repos: each runner is still repo-scoped by
    # registration, so an EAB job can never reach another repo's runner
    # regardless of label. See ~/pudding/pi-github-runner-setup.md.
    runs-on: [self-hosted, build-linux-arm64]
    timeout-minutes: 20
    env:
      REPO_DIR: /home/jay/pudding/entitlement-achievement-blockchain
    steps:
      - name: Sync checkout to the triggering commit
        run: |
          cd "$REPO_DIR"
          git fetch github "$GITHUB_SHA"
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo fmt --check
        working-directory: ${{ env.REPO_DIR }}
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: ${{ env.REPO_DIR }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test --workspace
        working-directory: ${{ env.REPO_DIR }}
        run: cargo test --locked --workspace
