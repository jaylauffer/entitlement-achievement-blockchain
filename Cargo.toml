[workspace]
members = [
    "eab-core",
    "eab-quic-client",
    "eab-wire",
    "game-sdk-rust",
    "rust",
]
resolver = "2"

[workspace.package]
name = "loadngo-entitlement-achievement-blockchain"
version = "0.1.0"
edition = "2021"
authors = ["eab maintainers"]
license = "BSD-3-Clause"
repository = "https://github.com/jaylauffer/entitlement-achievement-blockchain"
description = "A hyper-dimensional player profile, entitlement, and achievement blockchain of the player journey"

[workspace.dependencies]
# External dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1"
sha2 = "0.10"
blake3 = "1"
chrono = "0.4"
hex = "0.4"
actix-web = "4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
sled = "0.34"
fs2 = "0.4"
qcoin-consensus = { path = "../qcoin/qcoin-consensus" }
qcoin-crypto = { path = "../qcoin/qcoin-crypto" }
qcoin-ledger = { path = "../qcoin/qcoin-ledger" }
qcoin-script = { path = "../qcoin/qcoin-script" }
qcoin-types = { path = "../qcoin/qcoin-types" }
loadngo-proactor = { path = "../loadngo/proactor" }
loadngo-network = { package = "network", path = "../loadngo/network" }
ureq = { version = "2.12", features = ["json"] }
thiserror = "1"
anyhow = "1"
minicbor = { version = "2.3", features = ["std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1.51", features = ["io-util", "rt", "sync", "time"] }
eab-core = { path = "eab-core" }
eab-quic-client = { path = "eab-quic-client" }
eab-wire = { path = "eab-wire" }
